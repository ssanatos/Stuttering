<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이다 맞대치 100선 퀴즈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }

        /* Glassmorphism visual effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .glass-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            outline: none;
        }

        /* Speech Bubble Pulse Animation */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .bubble-anim {
            animation: pulse-subtle 3s infinite ease-in-out;
        }

        /* Custom Scrollbar for list selection */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between min-h-screen p-4 sm:p-6 md:p-8">

    <!-- Top Navigation & Header -->
    <header class="max-w-3xl w-full mx-auto mb-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                <i class="fa-solid font-bold text-white text-xl">⚡</i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300">
                    사이다 맞대치 퀴즈
                </h1>
                <p class="text-xs text-slate-400">10자 이하 촌철살인으로 황당 상황 제압하기</p>
            </div>
        </div>

        <!-- Quick Controls -->
        <div class="flex items-center space-x-2">
            <button id="btn-sound-toggle" onclick="toggleAutoSound()" class="p-2.5 rounded-lg glass-card hover:bg-white/10 text-slate-300 transition-all text-xs flex items-center gap-1.5" title="음성 자동 재생 설정">
                <i id="sound-icon" class="fa-solid fa-volume-high text-purple-400"></i>
                <span id="sound-text" class="hidden sm:inline">음성 켜짐</span>
            </button>
            <button onclick="shuffleQuestions()" class="p-2.5 rounded-lg glass-card hover:bg-white/10 text-slate-300 transition-all text-xs flex items-center gap-1.5" title="문제 무작위 섞기">
                <i class="fa-solid fa-shuffle text-pink-400"></i>
                <span class="hidden sm:inline">랜덤 섞기</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto my-auto py-2">
        
        <!-- Progress Bar Card -->
        <div class="glass-card rounded-2xl p-4 sm:p-5 mb-6 shadow-2xl">
            <div class="flex justify-between items-center mb-2 text-xs sm:text-sm font-semibold">
                <span class="text-purple-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-layer-group"></i>
                    카테고리: <span id="category-badge" class="px-2 py-0.5 rounded-md bg-purple-500/20 text-purple-300 border border-purple-500/30">적반하장</span>
                </span>
                <span class="text-slate-300 font-mono">
                    <span id="current-index-text" class="text-pink-400 font-bold text-base">1</span> / <span id="total-count-text">100</span>
                </span>
            </div>
            <!-- Progress Line -->
            <div class="w-full bg-slate-800/80 rounded-full h-3 overflow-hidden p-0.5 border border-white/5">
                <div id="progress-bar" class="bg-gradient-to-r from-purple-500 via-pink-500 to-amber-400 h-full rounded-full transition-all duration-500 ease-out" style="width: 1%;"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden border border-white/10 bubble-anim">
            
            <!-- Category Icon & Badge -->
            <div class="flex justify-between items-start mb-6">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">
                    상대의 황당한 발언
                </span>
                <button onclick="speakCurrentQuestion()" class="px-3.5 py-1.5 rounded-full bg-purple-600/30 hover:bg-purple-600/50 border border-purple-400/40 text-purple-200 text-xs font-medium transition-all flex items-center gap-2 active:scale-95 shadow-md">
                    <i class="fa-solid fa-volume-high text-sm"></i>
                    <span>다시 듣기</span>
                </button>
            </div>

            <!-- Situation Text Box -->
            <div class="mb-8 min-h-[90px] flex items-center">
                <blockquote class="text-xl sm:text-2xl font-bold text-white leading-relaxed tracking-tight w-full" id="question-text">
                    "공 놀이 하다가 자기가 실수로 맞고서 '공 똑바로 던져라 새끼야' 할 때"
                </blockquote>
            </div>

            <!-- User Input Form -->
            <form onsubmit="handleAnswerSubmit(event)" class="space-y-4">
                <div>
                    <label for="user-answer" class="block text-xs font-semibold text-slate-300 mb-2">
                        💬 당신의 사이다 맞대치 (10자 이하 추천)
                    </label>
                    <div class="relative flex items-center">
                        <input 
                            type="text" 
                            id="user-answer" 
                            placeholder="예: 얼굴이 공을 잡네?" 
                            maxlength="30"
                            autocomplete="off"
                            class="glass-input w-full px-5 py-4 rounded-xl text-lg font-medium placeholder-slate-500 focus:outline-none transition-all pr-12"
                        >
                        <span id="char-counter" class="absolute right-4 text-xs font-mono text-slate-400">0/10</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
                    <button type="submit" class="col-span-2 sm:col-span-2 py-3.5 px-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl shadow-lg shadow-purple-600/30 active:scale-95 transition-all flex justify-center items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>제출 & 판정</span>
                    </button>
                    <button type="button" onclick="toggleAnswerHint()" class="py-3.5 px-3 bg-slate-800/80 hover:bg-slate-700 text-amber-300 font-semibold rounded-xl border border-amber-400/30 active:scale-95 transition-all flex justify-center items-center gap-1.5 text-xs sm:text-sm">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>모범 답안</span>
                    </button>
                    <button type="button" onclick="nextQuestion()" class="py-3.5 px-3 bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-white/10 active:scale-95 transition-all flex justify-center items-center gap-1.5 text-xs sm:text-sm">
                        <span>다음</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <!-- Feedback & Match Rate Result Panel (Initially Hidden) -->
            <div id="result-panel" class="hidden mt-6 pt-6 border-t border-white/10 space-y-3 animate-fade-in">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">일치율 판정 결과</span>
                    <span id="match-score-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                        100% 일치
                    </span>
                </div>
                
                <!-- Score & Feedback Text -->
                <div class="p-4 rounded-xl bg-slate-900/60 border border-white/5 space-y-1">
                    <div id="feedback-headline" class="text-lg font-bold text-pink-400">
                        🔥 완벽한 사이다! 상대를 완파했습니다!
                    </div>
                    <div id="feedback-detail" class="text-sm text-slate-300">
                        문맥과 키워드가 거의 완벽하게 일치합니다.
                    </div>
                </div>
            </div>

            <!-- Model Answer Panel (Toggleable) -->
            <div id="model-answer-panel" class="hidden mt-4 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200 space-y-1">
                <div class="flex items-center gap-2 font-bold text-sm text-amber-300">
                    <i class="fa-solid fa-star"></i>
                    <span>추천 모범 답안 (10자 이하)</span>
                </div>
                <div id="model-answer-text" class="text-xl font-extrabold text-white tracking-wide pt-1">
                    "얼굴이 공을 잡네?"
                </div>
            </div>

        </div>

        <!-- Jump to Question Input (Footer Utility) -->
        <div class="mt-4 flex justify-between items-center text-xs text-slate-400 px-2">
            <div class="flex items-center gap-2">
                <span>문제 이동:</span>
                <input type="number" id="jump-input" min="1" max="100" class="w-16 px-2 py-1 rounded bg-slate-800 text-white border border-slate-700 text-center font-mono">
                <button onclick="jumpToQuestion()" class="px-2.5 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-200">이동</button>
            </div>
            <button onclick="resetProgress()" class="hover:underline text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-rotate-right mr-1"></i>처음부터 재시작
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-3xl w-full mx-auto mt-6 text-center text-xs text-slate-500">
        <p>© 2026 사이다 맞대치 100선 퀴즈 • GitHub Pages Ready</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // 1. Data Store (100 Scenarios & Responses)
        // ==========================================
        const quizData = [
            // Category 1: 적반하장 & 남 탓형 (1 ~ 20)
            { id: 1, category: "적반하장 & 남 탓", q: "공 놀이 중 자기 혼자 맞아놓고 \"똑바로 던져라 새끼야\" 할 때", a: "얼굴이 공을 잡네?" },
            { id: 2, category: "적반하장 & 남 탓", q: "커피 흘린 사람이 \"왜 거기 서 있었어?\" 할 때", a: "내가 장애물이야?" },
            { id: 3, category: "적반하장 & 남 탓", q: "지각해 놓고 \"왜 일찍 와서 눈치 줘?\" 할 때", a: "시계 보고 말해." },
            { id: 4, category: "적반하장 & 남 탓", q: "지가 발 걸려 넘어지고 \"왜 걸리적거려?\" 할 때", a: "발은 뇌가 조종해." },
            { id: 5, category: "적반하장 & 남 탓", q: "지가 새치기하고 \"바빠서 그랬어요\" 할 때", a: "안 바쁜 사람 없어." },
            { id: 6, category: "적반하장 & 남 탓", q: "길에서 부딪혀놓고 \"눈 어디 두고 다니냐?\" 할 때", a: "너 보라고 뒀다." },
            { id: 7, category: "적반하장 & 남 탓", q: "비밀 말해놓고 소문나자 \"네가 유출했지?\" 할 때", a: "입은 네가 열었어." },
            { id: 8, category: "적반하장 & 남 탓", q: "자가용 얻어타고 가면서 \"차 꼴이 이게 뭐냐\" 할 때", a: "걸어가면 새 차야." },
            { id: 9, category: "적반하장 & 남 탓", q: "돈 늦게 갚으면서 \"겨우 이거 갖고 짠하게\" 할 때", a: "짠한 건 네 주머니." },
            { id: 10, category: "적반하장 & 남 탓", q: "지 옷에 떡볶이 국물 튀기고 \"왜 그거 시켰어?\" 할 때", a: "숟가락 탓을 해라." },
            { id: 11, category: "적반하장 & 남 탓", q: "과속하다 걸리고 \"왜 나만 잡아?\" 할 때", a: "네가 제일 빨라." },
            { id: 12, category: "적반하장 & 남 탓", q: "시험 망치고 \"출제자가 문제 이상함\" 할 때", a: "답안지가 이상해." },
            { id: 13, category: "적반하장 & 남 탓", q: "지가 길 잃고 \"지도가 이상한데?\" 할 때", a: "나침반이 울겠다." },
            { id: 14, category: "적반하장 & 남 탓", q: "음식 다 남겨놓고 \"맛이 없어서\" 할 때", a: "입맛을 탓해라." },
            { id: 15, category: "적반하장 & 남 탓", q: "업무 빵꾸내고 \"말을 안 해줬잖아\" 할 때", a: "뇌는 장식이야?" },
            { id: 16, category: "적반하장 & 남 탓", q: "실수해놓고 \"그럴 수도 있지 왜 화냄?\" 할 때", a: "화내는 것도 그럴 수 있음." },
            { id: 17, category: "적반하장 & 남 탓", q: "컴퓨터 고장 내고 \"원래 이상했어\" 할 때", a: "손대기 전엔 멀쩡해." },
            { id: 18, category: "적반하장 & 남 탓", q: "메시지 읽씹하다 \"왜 독촉해?\" 할 때", a: "손가락 부러졌냐?" },
            { id: 19, category: "적반하장 & 남 탓", q: "지가 떨어뜨리고 \"왜 거다 뒀어?\" 할 때", a: "지구 중력 탓해." },
            { id: 20, category: "적반하장 & 남 탓", q: "커피 사주니 \"난 바닐라라떼만 마시는데\" 할 때", a: "사준 건 그냥 마셔." },

            // Category 2: 뻔뻔함 & 민폐형 (21 ~ 40)
            { id: 21, category: "뻔뻔함 & 민폐", q: "도서관 짐만 두고 3시간 뒤 와서 \"여기 내 자린데요\" 할 때", a: "등기 쳤어요?" },
            { id: 22, category: "뻔뻔함 & 민폐", q: "지하철 2자리 차지하고 \"짐 놓을 곳이 없어서\" 할 때", a: "짐도 요금 냈나요?" },
            { id: 23, category: "뻔뻔함 & 민폐", q: "남의 우산 훔쳐 쓰며 \"급해서 썼어요\" 할 때", a: "난 안 급해 보임?" },
            { id: 24, category: "뻔뻔함 & 민폐", q: "식당에서 아이가 난동 치는데 \"애한테 왜 그래요?\" 할 때", a: "부모가 안 하니까." },
            { id: 25, category: "뻔뻔함 & 민폐", q: "상습 지각러가 \"나 원래 차 막히는 거 알잖아\" 할 때", a: "일찍 나오면 됨." },
            { id: 26, category: "뻔뻔함 & 민폐", q: "영화관에서 폰 밝게 보면서 \"급한 연락이라\" 할 때", a: "나가서 보세요." },
            { id: 27, category: "뻔뻔함 & 민폐", q: "남의 음식 한 입만이라더니 다 먹고 \"별로네\" 할 때", a: "다 먹고 평가하냐?" },
            { id: 28, category: "뻔뻔함 & 민폐", q: "공용 냉장고 남의 음료 마시고 \"네 거였어?\" 할 때", a: "네 거 아니면 먹지 마." },
            { id: 29, category: "뻔뻔함 & 민폐", q: "주차 두 칸 잡아먹고 \"문콕 당할까 봐\" 할 때", a: "두 칸 요금 내세요." },
            { id: 30, category: "뻔뻔함 & 민폐", q: "남의 차 보닛에 음료컵 두고 갈 때", a: "쓰레기통 아닌데요." },
            { id: 31, category: "뻔뻔함 & 민폐", q: "카페에서 음료 1개 시키고 8시간 앉아있을 때", a: "숙박업소 아니에요." },
            { id: 32, category: "뻔뻔함 & 민폐", q: "새치기하면서 \"나 어르신인데\" 할 때", a: "줄은 다 같이 서요." },
            { id: 33, category: "뻔뻔함 & 민폐", q: "택시에서 \"돈 없는데 계좌이체 나중에 됨?\" 할 때", a: "경찰서로 갈까요?" },
            { id: 34, category: "뻔뻔함 & 민폐", q: "남의 집 방문해서 \"집이 좀 좁네\" 할 때", a: "호텔 가세요." },
            { id: 35, category: "뻔뻔함 & 민폐", q: "길거리 담배 연기 내뿜으며 \"야외잖아\" 할 때", a: "내 허파는 야외 아님." },
            { id: 36, category: "뻔뻔함 & 민폐", q: "공공장소 스피커폰 통화하며 \"왜 노려봐?\" 할 때", a: "통화 내용 다 들림." },
            { id: 37, category: "뻔뻔함 & 민폐", q: "남의 일기장/폰 몰래 보고 \"궁금해서\" 할 때", a: "선은 넘지 말지." },
            { id: 38, category: "뻔뻔함 & 민폐", q: "뷔페에서 음식 싹 쓸어가며 \"남을까 봐\" 할 때", a: "혼자 다 드시게?" },
            { id: 39, category: "뻔뻔함 & 민폐", q: "버스에서 다리 쩍 벌리고 앉을 때", a: "오므리세요 좀." },
            { id: 40, category: "뻔뻔함 & 민폐", q: "빌려 간 책 더럽혀놓고 \"책은 읽으려고 사는 거지\" 할 때", a: "새 책으로 사와." },

            // Category 3: 뻔선 & 가스라이팅형 (41 ~ 60)
            { id: 41, category: "뻔선 & 가스라이팅", q: "바람피우고 \"억울하면 너도 펴\" 할 때", a: "쓰레기통엔 안 들어가." },
            { id: 42, category: "뻔선 & 가스라이팅", q: "거짓말 걸리고 \"다 너를 위해서였어\" 할 때", a: "위하지 말고 솔직해." },

        // ==========================================
        // 3. String Similarity Algorithm (Levenshtein Distance + Keyword match)
        // ==========================================
        
        /**
         * Calculate Levenshtein distance between two strings
         */
        function calculateLevenshteinDistance(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) {
                matrix[i] = [i];
            }
            for (let j = 0; j <= a.length; j++) {
                matrix[0][j] = j;
            }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, // substitution
                            Math.min(
                                matrix[i][j - 1] + 1, // insertion
                                matrix[i - 1][j] + 1  // deletion
                            )
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        /**
         * Clean string for fair similarity comparison (removes punctuation and spaces)
         */
        function cleanString(str) {
            return str.replace(/[^\w\sㄱ-ㅎ가-힣]/g, '').replace(/\s+/g, '').toLowerCase();
        }

        /**
         * Calculate match score percentage (0 - 100)
         */
        function calculateSimilarityPercentage(userInput, targetAnswer) {
            const cleanUser = cleanString(userInput);
            const cleanTarget = cleanString(targetAnswer);

            if (!cleanUser) return 0;
            if (cleanUser === cleanTarget) return 100;

            // Direct substring/inclusion check bonus
            let substringBonus = 0;
            if (cleanTarget.includes(cleanUser) || cleanUser.includes(cleanTarget)) {
                substringBonus = 20;
            }

            const maxLength = Math.max(cleanUser.length, cleanTarget.length);
            if (maxLength === 0) return 100;

            const distance = calculateLevenshteinDistance(cleanUser, cleanTarget);
            let similarity = ((maxLength - distance) / maxLength) * 100;

            // Combine base similarity with sub-string match check
            let finalScore = Math.min(100, Math.round(similarity + substringBonus));
            return Math.max(0, finalScore);
        }

        // ==========================================
        // 4. TTS (Web Speech API) Integration
        // ==========================================
        function speakCurrentQuestion() {
            if (!('speechSynthesis' in window)) {
                console.warn('Speech Synthesis is not supported in this browser.');
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const currentQ = questions[currentIndex];
            // Format spoken text cleanly
            const speechText = currentQ.q;
            
            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0; // Normal speed
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        }

            modelAnswerPanelEl.classList.add('hidden');

            // Auto focus
            userAnswerInput.focus();

            // Auto TTS if enabled
            if (isAutoSoundOn) {
                // Short timeout to let UI update smoothly first
                setTimeout(() => {
                    speakCurrentQuestion();
                }, 150);
            }

        function handleAnswerSubmit(event) {
            event.preventDefault();
            const val = userAnswerInput.value.trim();
            if (!val) {
                alert('답안을 입력해주세요!');
                userAnswerInput.focus();
                return;

            const currentItem = questions[currentIndex];
            const matchScore = calculateSimilarityPercentage(val, currentItem.a);

            // Display Score & Badge Styling
            matchScoreBadgeEl.textContent = `${matchScore}% 일치`;
            if (matchScore >= 80) {
                matchScoreBadgeEl.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";

        }

        function toggleAnswerHint() {
            modelAnswerPanelEl.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderCurrentQuestion();
            } else {
                alert('🎉 100문제를 모두 마쳤습니다! 수고하셨습니다!');
                currentIndex = 0;
                renderCurrentQuestion();
            }
        }

        function shuffleQuestions() {
            if (confirm('문제를 무작위 순서로 섞으시겠습니까?')) {
                for (let i = questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questions[i], questions[j]] = [questions[j], questions[i]];
                }
                currentIndex = 0;
                renderCurrentQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInputEl.value, 10);
            if (isNaN(val) || val < 1 || val > questions.length) {
                alert(`1부터 ${questions.length} 사이의 번호를 입력해주세요.`);
                return;
            }
            currentIndex = val - 1;
            renderCurrentQuestion();
            jumpInputEl.value = '';
        }

        function resetProgress() {
            if (confirm('퀴즈를 처음 1번 문제부터 다시 시작할까요?')) {
                questions = [...quizData];
                currentIndex = 0;
                renderCurrentQuestion();
            }
        }

        // Track Character Count in Input
        userAnswerInput.addEventListener('input', (e) => {
            const length = e.target.value.length;
            charCounterEl.textContent = `${length}/10`;
            if (length > 10) {
                charCounterEl.classList.add('text-amber-400');
                charCounterEl.classList.remove('text-slate-400');
            } else {
                charCounterEl.classList.remove('text-amber-400');
                charCounterEl.classList.add('text-slate-400');
            }
        });

        // Initialize App on Window Load
        window.onload = function() {
            renderCurrentQuestion();
        };
    </script>
</body>
</html>
