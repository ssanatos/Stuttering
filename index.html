<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말더듬이의 촌철살인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }

        /* Glassmorphism visual effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .glass-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            outline: none;
        }

        /* Speech Bubble Pulse Animation */

        /* Custom Scrollbar for list selection */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between min-h-screen p-4 sm:p-6 md:p-8">

    <!-- Top Navigation & Header -->
    <header class="max-w-3xl w-full mx-auto mb-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                <i class="fa-solid font-bold text-white text-xl">⚡</i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300">
                    말더듬이의 촌철살인
                </h1>
                <p class="text-xs text-slate-400">10자 이하 촌철살인으로 황당 상황 제압하기</p>
            </div>
        </div>

        <!-- Quick Controls -->
        <div class="flex items-center space-x-2">
            <button id="btn-sound-toggle" onclick="toggleAutoSound()" class="p-2.5 rounded-lg glass-card hover:bg-white/10 text-slate-300 transition-all text-xs flex items-center gap-1.5" title="음성 자동 재생 설정">
                <i id="sound-icon" class="fa-solid fa-volume-high text-purple-400"></i>
                <span id="sound-text" class="hidden sm:inline">음성 켜짐</span>
            </button>
            <button onclick="shuffleQuestions()" class="p-2.5 rounded-lg glass-card hover:bg-white/10 text-slate-300 transition-all text-xs flex items-center gap-1.5" title="문제 무작위 섞기">
                <i class="fa-solid fa-shuffle text-pink-400"></i>
                <span class="hidden sm:inline">랜덤 섞기</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto my-auto py-2">
        
        <!-- Progress Bar Card -->
        <div class="glass-card rounded-2xl p-4 sm:p-5 mb-6 shadow-2xl">
            <div class="flex justify-between items-center mb-2 text-xs sm:text-sm font-semibold">
                <span class="text-purple-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-layer-group"></i>
                    카테고리: <span id="category-badge" class="px-2 py-0.5 rounded-md bg-purple-500/20 text-purple-300 border border-purple-500/30">적반하장</span>
                </span>
                <span class="text-slate-300 font-mono">
                    <span id="current-index-text" class="text-pink-400 font-bold text-base">1</span> / <span id="total-count-text">0</span>
                </span>
            </div>
            <!-- Progress Line -->
            <div class="w-full bg-slate-800/80 rounded-full h-3 overflow-hidden p-0.5 border border-white/5">
                <div id="progress-bar" class="bg-gradient-to-r from-purple-500 via-pink-500 to-amber-400 h-full rounded-full transition-all duration-500 ease-out" style="width: 1%;"></div>
            </div>
        </div>

        <div class="flex flex-wrap gap-2 mb-4 text-xs">
            <select id="filter-group" onchange="onGroupChange()" class="glass-input flex-1 px-3 py-2 rounded-lg"></select>
            <select id="filter-cat" onchange="onCatChange()" class="glass-input flex-1 px-3 py-2 rounded-lg"></select>
            <select id="filter-sub" onchange="applyFilters()" class="glass-input flex-1 px-3 py-2 rounded-lg"></select>
        </div>
        <!-- Question Card -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden border border-white/10">
            
            <!-- Category Icon & Badge -->
            <div class="flex justify-between items-start mb-6">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">
                    상대의 황당한 발언
                </span>
                <button onclick="speakCurrentQuestion()" class="px-3.5 py-1.5 rounded-full bg-purple-600/30 hover:bg-purple-600/50 border border-purple-400/40 text-purple-200 text-xs font-medium transition-all flex items-center gap-2 active:scale-95 shadow-md">
                    <i class="fa-solid fa-volume-high text-sm"></i>
                    <span>다시 듣기</span>
                </button>
            </div>

            <!-- Situation Text Box -->
            <div class="mb-8 min-h-[90px] flex items-center">
                <blockquote class="text-xl sm:text-2xl font-bold text-white leading-relaxed tracking-tight w-full" id="question-text">
                    "공 놀이 하다가 자기가 실수로 맞고서 '공 똑바로 던져라 새끼야' 할 때"
                </blockquote>
            </div>

            <!-- User Input Form -->
            <form onsubmit="handleAnswerSubmit(event)" class="space-y-4">
                <div>
                    <label for="user-answer" class="block text-xs font-semibold text-slate-300 mb-2">
                        💬 당신의 촌철살인 (10자 이하 추천)
                    </label>
                    <div class="relative flex items-center">
                        <input 
                            type="text" 
                            id="user-answer" 
                            placeholder="예: 책임 질 수 있어요?" 
                            maxlength="30"
                            autocomplete="off"
                            class="glass-input w-full px-5 py-4 rounded-xl text-lg font-medium placeholder-slate-500 focus:outline-none transition-all pr-12"
                        >
                        <span id="char-counter" class="absolute right-4 text-xs font-mono text-slate-400">0/10</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
                    <button type="submit" class="col-span-2 sm:col-span-2 py-3.5 px-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl shadow-lg shadow-purple-600/30 active:scale-95 transition-all flex justify-center items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>제출 & 판정</span>
                    </button>
                    <button type="button" onclick="toggleAnswerHint()" class="py-3.5 px-3 bg-slate-800/80 hover:bg-slate-700 text-amber-300 font-semibold rounded-xl border border-amber-400/30 active:scale-95 transition-all flex justify-center items-center gap-1.5 text-xs sm:text-sm">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>모범 답안</span>
                    </button>
                    <button type="button" onclick="nextQuestion()" class="py-3.5 px-3 bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-white/10 active:scale-95 transition-all flex justify-center items-center gap-1.5 text-xs sm:text-sm">
                        <span>다음</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <!-- Feedback & Match Rate Result Panel (Initially Hidden) -->
            <div id="result-panel" class="hidden mt-6 pt-6 border-t border-white/10 space-y-3 animate-fade-in">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">일치율 판정 결과</span>
                    <span id="match-score-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                        100% 일치
                    </span>
                </div>
                
                <!-- Score & Feedback Text -->
                <div class="p-4 rounded-xl bg-slate-900/60 border border-white/5 space-y-1">
                    <div id="feedback-headline" class="text-lg font-bold text-pink-400">
                        🔥 완벽한 사이다! 상대를 완파했습니다!
                    </div>
                    <div id="feedback-detail" class="text-sm text-slate-300">
                        문맥과 키워드가 거의 완벽하게 일치합니다.
                    </div>
                </div>
            </div>

            <!-- Model Answer Panel (Toggleable) -->
            <div id="model-answer-panel" class="hidden mt-4 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200 space-y-1">
                <div class="flex items-center gap-2 font-bold text-sm text-amber-300">
                    <i class="fa-solid fa-star"></i>
                    <span>상황별 후보 답안 (톤·기법별)</span>
                </div>
                <div id="model-answer-text" class="text-xl font-extrabold text-white tracking-wide pt-1">
                    "책임 질 수 있어요?"
                </div>
                <div id="tech-info" class="text-xs text-amber-200/80 pt-1"></div>
            </div>

        </div>

        <!-- Jump to Question Input (Footer Utility) -->
        <div class="mt-4 flex justify-between items-center text-xs text-slate-400 px-2">
            <div class="flex items-center gap-2">
                <span>문제 이동:</span>
                <input type="number" id="jump-input" min="1" max="100" class="w-16 px-2 py-1 rounded bg-slate-800 text-white border border-slate-700 text-center font-mono">
                <button onclick="jumpToQuestion()" class="px-2.5 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-200">이동</button>
            </div>
            <button onclick="resetProgress()" class="hover:underline text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-rotate-right mr-1"></i>처음부터 재시작
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-3xl w-full mx-auto mt-6 text-center text-xs text-slate-500">
        <p>© 2026 말더듬이의 촌철살인 • GitHub Pages Ready</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // 1. Data Store (100 Scenarios & Responses)
        // ==========================================
        const T = {"희":"희화화","본":"본질 찌르기","비":"비유 압축","관":"관점 비틀기","논":"논리 허점","도":"도덕·상식","가":"가치 평가","직":"직업윤리·역할","손":"손익 따지기","능":"능력 미달","인":"상대 말 가져오기","반":"반전 유머"};

        const categoryBadgeEl = document.getElementById('category-badge');
        const currentIndexTextEl = document.getElementById('current-index-text');
        const totalCountTextEl = document.getElementById('total-count-text');
        const progressBarEl = document.getElementById('progress-bar');
        const userAnswerInput = document.getElementById('user-answer');
        const charCounterEl = document.getElementById('char-counter');
        const resultPanelEl = document.getElementById('result-panel');
        const matchScoreBadgeEl = document.getElementById('match-score-badge');
        const feedbackHeadlineEl = document.getElementById('feedback-headline');
        const feedbackDetailEl = document.getElementById('feedback-detail');
        const modelAnswerPanelEl = document.getElementById('model-answer-panel');
        const modelAnswerTextEl = document.getElementById('model-answer-text');
        const soundIconEl = document.getElementById('sound-icon');
        const soundTextEl = document.getElementById('sound-text');
        const jumpInputEl = document.getElementById('jump-input');

        // ==========================================
        // 3. String Similarity Algorithm (Levenshtein Distance + Keyword match)
        // ==========================================
        
        /**
         * Calculate Levenshtein distance between two strings
         */
        function calculateLevenshteinDistance(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) {
                matrix[i] = [i];
            }
            for (let j = 0; j <= a.length; j++) {
                matrix[0][j] = j;
            }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, // substitution
                            Math.min(
                                matrix[i][j - 1] + 1, // insertion
                                matrix[i - 1][j] + 1  // deletion
                            )
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        /**
         * Clean string for fair similarity comparison (removes punctuation and spaces)
         */
        function cleanString(str) {
            return str.replace(/[^\w\sㄱ-ㅎ가-힣]/g, '').replace(/\s+/g, '').toLowerCase();
        }

        /**
         * Calculate match score percentage (0 - 100)
         */
        function calculateSimilarityPercentage(userInput, targetAnswer) {
            const cleanUser = cleanString(userInput);
            const cleanTarget = cleanString(targetAnswer);

            if (!cleanUser) return 0;
            if (cleanUser === cleanTarget) return 100;

            // Direct substring/inclusion check bonus
            let substringBonus = 0;
            if (cleanTarget.includes(cleanUser) || cleanUser.includes(cleanTarget)) {
                substringBonus = 20;
            }

            const maxLength = Math.max(cleanUser.length, cleanTarget.length);
            if (maxLength === 0) return 100;

            const distance = calculateLevenshteinDistance(cleanUser, cleanTarget);
            let similarity = ((maxLength - distance) / maxLength) * 100;

            // Combine base similarity with sub-string match check
            let finalScore = Math.min(100, Math.round(similarity + substringBonus));
            return Math.max(0, finalScore);
        }

        // ==========================================
        // 4. TTS (Web Speech API) Integration
        // ==========================================
        function speakCurrentQuestion() {
            if (!('speechSynthesis' in window)) {
                console.warn('Speech Synthesis is not supported in this browser.');
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const currentQ = questions[currentIndex];
            // Format spoken text cleanly
            const speechText = currentQ.q;
            
            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0; // Normal speed
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        function toggleAutoSound() {
            isAutoSoundOn = !isAutoSoundOn;
            if (isAutoSoundOn) {
                soundIconEl.className = "fa-solid fa-volume-high text-purple-400";
                soundTextEl.textContent = "음성 켜짐";
            } else {
                soundIconEl.className = "fa-solid fa-volume-xmark text-slate-500";
                soundTextEl.textContent = "음성 꺼짐";
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        // ==========================================
        // 5. UI Render & State Handlers
        // ==========================================
        function renderCurrentQuestion() {
            const item = questions[currentIndex];
            
            // Text updates
            questionTextEl.textContent = item.q;
            categoryBadgeEl.textContent = `${item.category} › ${item.sub}`;
            currentIndexTextEl.textContent = currentIndex + 1;
            totalCountTextEl.textContent = questions.length;
            
            // Progress Bar update
            const progressPercent = ((currentIndex + 1) / questions.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;

            // Reset input and panels
            userAnswerInput.value = '';
            charCounterEl.textContent = '0/10';
            resultPanelEl.classList.add('hidden');
            modelAnswerPanelEl.classList.add('hidden');
            modelAnswerTextEl.innerHTML = item.answers.map(x => `<div class="text-base font-bold py-0.5"><span class="text-xs text-amber-300 mr-2">[${TN[x.tone]}·${T[x.tech]}]</span>"${x.a}"</div>`).join('');

            // Auto focus
            userAnswerInput.focus();

            // Auto TTS if enabled
            if (isAutoSoundOn) {
                // Short timeout to let UI update smoothly first
                setTimeout(() => {
                    speakCurrentQuestion();
                }, 150);
            }
        }

        function handleAnswerSubmit(event) {
            event.preventDefault();
            const val = userAnswerInput.value.trim();
            if (!val) {
                alert('답안을 입력해주세요!');
                userAnswerInput.focus();
                return;
            }

            const currentItem = questions[currentIndex];
            const best = currentItem.answers.reduce((m, x) => { const s = calculateSimilarityPercentage(val, x.a); return s > m.s ? { s, a: x.a } : m; }, { s: -1, a: '' });
            const matchScore = best.s;

            // Display Score & Badge Styling
            matchScoreBadgeEl.textContent = `유사도 ${matchScore}% (참고)`;
            if (matchScore >= 80) {
                matchScoreBadgeEl.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
                feedbackHeadlineEl.textContent = "🔥 완벽한 사이다! 상대를 완파했습니다!";
                feedbackHeadlineEl.className = "text-lg font-bold text-emerald-400";
                feedbackDetailEl.textContent = `모범 답안("${best.a}")과 매우 유사합니다! 순발력이 훌륭하네요.`;
            } else if (matchScore >= 40) {
                matchScoreBadgeEl.className = "px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40";
                feedbackHeadlineEl.textContent = "⚡ 제법인데요? 타격감이 상당합니다!";
                feedbackHeadlineEl.className = "text-lg font-bold text-amber-400";
                feedbackDetailEl.textContent = `좋은 시도입니다! 모범 답안("${best.a}")의 의도와 잘 맞닿아 있습니다.`;
            } else {
                matchScoreBadgeEl.className = "px-3 py-1 rounded-full text-xs font-bold bg-pink-500/20 text-pink-300 border border-pink-500/40";
                feedbackHeadlineEl.textContent = "😅 조금 더 독해질 필요가 있어요!";
                feedbackHeadlineEl.className = "text-lg font-bold text-pink-400";
                feedbackDetailEl.textContent = `상대를 더 어리둥절하게 만들 10자 이하 촌철살인을 장전해보세요!`;
            }

            if (val.replace(/[\s.,?!~]/g, '').length > 10) feedbackDetailEl.textContent += ' ⚠ 10자 초과! 더 줄여보세요.';
            else feedbackDetailEl.textContent += ' ✅ 10자 이내. 다른 기법으로도 한 번 더 시도해보세요.';
            resultPanelEl.classList.remove('hidden');
            {
                modelAnswerPanelEl.classList.remove('hidden');
            }
        }

        function toggleAnswerHint() {
            modelAnswerPanelEl.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderCurrentQuestion();
            } else {
                alert(`🎉 ${questions.length}문제를 모두 마쳤습니다!`);
                currentIndex = 0;
                renderCurrentQuestion();
            }
        }

        function shuffleQuestions() {
            if (confirm('문제를 무작위 순서로 섞으시겠습니까?')) {
                for (let i = questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questions[i], questions[j]] = [questions[j], questions[i]];
                }
                currentIndex = 0;
                renderCurrentQuestion();
            }
        }

        function jumpToQuestion() {
            const val = parseInt(jumpInputEl.value, 10);
            if (isNaN(val) || val < 1 || val > questions.length) {
                alert(`1부터 ${questions.length} 사이의 번호를 입력해주세요.`);
                return;
            }
            currentIndex = val - 1;
            renderCurrentQuestion();
            jumpInputEl.value = '';
        }

        const GROUPS = {"시설 이용": ["외식·줄서기", "카페", "PC방", "노래방", "사우나·목욕탕", "공원", "콘서트장", "클럽", "과학관", "박물관·미술관", "수족관", "놀이공원", "오락실", "영화관", "도서관", "지하상가", "대형마트", "백화점", "전통시장", "스포츠 경기장", "공항", "호텔", "수영장", "편의점", "결혼식·장례식", "주유소", "캠핑장", "해수욕장", "헬스장·운동", "병원·약국", "미용실", "쇼핑·서비스"], "관공서": ["주민센터", "시청", "법원", "경찰서", "세무서", "보건소·복지", "출입국·여권", "소방서·119", "우체국", "국민연금·건보공단", "고용센터", "병무청", "운전면허시험장", "세무·등기", "군청·읍면사무소", "교도소", "선관위", "교육청·학교", "구청(건축·교통·환경)"], "직장·학교·군대": ["직장", "학교", "군대", "병원 태움", "학원", "은행"], "인간관계": ["연애", "가족·친척", "친구·금전", "훈계·간섭", "이웃·공공장소"], "비하·외모": ["외모 비하", "목소리·말투 비하", "출신·가정 비하", "경제력 비하", "성격 비하", "학력·직업 비하", "나이 비하"], "교통": ["운전·교통", "대중교통"], "온라인": ["온라인", "SNS·온라인"]};
        function groupOf(c) { for (const [g, cs] of Object.entries(GROUPS)) if (cs.includes(c)) return g; return '기타'; }
        function fillCats() {
            const g = document.getElementById('filter-group').value;
            const cats = Object.keys(D).filter(c => !g || groupOf(c) === g);
            document.getElementById('filter-cat').innerHTML = '<option value="">전체 대분류</option>' + cats.map(c => `<option>${c}</option>`).join('');
            fillSubs();
        }
        function fillSubs() {
            const c = document.getElementById('filter-cat').value;
            const subs = c ? Object.keys(D[c]) : [];
            document.getElementById('filter-sub').innerHTML = '<option value="">전체 세분류</option>' + subs.map(s => `<option>${s}</option>`).join('');
        }
        function onGroupChange() { fillCats(); applyFilters(); }
        function onCatChange() { fillSubs(); applyFilters(); }
        function applyFilters() {
            const g = document.getElementById('filter-group').value, c = document.getElementById('filter-cat').value, s = document.getElementById('filter-sub').value;
            questions = quizData.filter(x => (!g || groupOf(x.category) === g) && (!c || x.category === c) && (!s || x.sub === s));
            if (!questions.length) questions = [...quizData];
            for (let i = questions.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [questions[i], questions[j]] = [questions[j], questions[i]]; }
            currentIndex = 0;
            renderCurrentQuestion();
        }

        function resetProgress() {
            if (confirm('퀴즈를 처음 1번 문제부터 다시 시작할까요?')) {
                applyFilters();
            }
        }

        // Track Character Count in Input
        userAnswerInput.addEventListener('input', (e) => {
            const length = e.target.value.replace(/[\s.,?!~]/g, '').length;
            charCounterEl.textContent = `${length}/10`;
            if (length > 10) {
                charCounterEl.classList.add('text-amber-400');
                charCounterEl.classList.remove('text-slate-400');
            } else {
                charCounterEl.classList.remove('text-amber-400');
                charCounterEl.classList.add('text-slate-400');
            }
        });

        // Initialize App on Window Load
        window.onload = function() {
            document.getElementById('filter-group').innerHTML = '<option value="">전체 분야</option>' + [...Object.keys(GROUPS), '기타'].filter(g => g !== '기타' || Object.keys(D).some(c => groupOf(c) === '기타')).map(g => `<option>${g}</option>`).join('');
            fillCats();
            fillSubs();
            applyFilters();
        };
    </script>
